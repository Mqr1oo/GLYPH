<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 250" width="1040" height="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8e8e93"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#30d158"/>
    </marker>
  </defs>
  <rect width="1040" height="250" rx="18" fill="#0d1117"/>

  <!-- phone -->
  <g transform="translate(20 60)">
    <rect width="150" height="120" rx="16" fill="#1c1c1e" stroke="#3a3a3c"/>
    <rect x="61" y="18" width="28" height="46" rx="6" fill="none" stroke="#0a84ff" stroke-width="3"/>
    <text x="75" y="90" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">Your phone</text>
    <text x="75" y="108" fill="#8e8e93" font-size="12.5" text-anchor="middle">GLYPH app</text>
  </g>

  <!-- device helper: drawn four times -->
  <g transform="translate(232 60)">
    <rect width="150" height="120" rx="16" fill="#1c1c1e" stroke="#3a3a3c"/>
    <rect x="50" y="22" width="50" height="38" rx="5" fill="none" stroke="#f2f2f7" stroke-width="3"/>
    <line x1="92" y1="22" x2="92" y2="8" stroke="#f2f2f7" stroke-width="3" stroke-linecap="round"/>
    <text x="75" y="90" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">Your GLYPH</text>
    <text x="75" y="108" fill="#8e8e93" font-size="12.5" text-anchor="middle">e-ink · GPS · LoRa</text>
  </g>
  <g transform="translate(444 60)">
    <rect width="150" height="120" rx="16" fill="#1c1c1e" stroke="#3a3a3c"/>
    <rect x="50" y="22" width="50" height="38" rx="5" fill="none" stroke="#f2f2f7" stroke-width="3"/>
    <line x1="92" y1="22" x2="92" y2="8" stroke="#f2f2f7" stroke-width="3" stroke-linecap="round"/>
    <text x="75" y="90" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">Teammate</text>
    <text x="75" y="108" fill="#8e8e93" font-size="12.5" text-anchor="middle">relays for others</text>
  </g>
  <g transform="translate(656 60)">
    <rect width="150" height="120" rx="16" fill="#1c1c1e" stroke="#3a3a3c"/>
    <rect x="50" y="22" width="50" height="38" rx="5" fill="none" stroke="#f2f2f7" stroke-width="3"/>
    <line x1="92" y1="22" x2="92" y2="8" stroke="#f2f2f7" stroke-width="3" stroke-linecap="round"/>
    <text x="75" y="90" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">Further away</text>
    <text x="75" y="108" fill="#8e8e93" font-size="12.5" text-anchor="middle">behind the ridge</text>
  </g>

  <!-- their phone -->
  <g transform="translate(868 60)">
    <rect width="150" height="120" rx="16" fill="#1c1c1e" stroke="#3a3a3c"/>
    <rect x="61" y="18" width="28" height="46" rx="6" fill="none" stroke="#0a84ff" stroke-width="3"/>
    <text x="75" y="90" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">Their phone</text>
    <text x="75" y="108" fill="#8e8e93" font-size="12.5" text-anchor="middle">optional</text>
  </g>

  <!-- links -->
  <line x1="176" y1="120" x2="226" y2="120" stroke="#8e8e93" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="201" y="108" fill="#8e8e93" font-size="12" text-anchor="middle">Bluetooth</text>

  <line x1="388" y1="120" x2="438" y2="120" stroke="#30d158" stroke-width="2.5" stroke-dasharray="6 5" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="413" y="108" fill="#30d158" font-size="12" text-anchor="middle">LoRa</text>

  <line x1="600" y1="120" x2="650" y2="120" stroke="#30d158" stroke-width="2.5" stroke-dasharray="6 5" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="625" y="108" fill="#30d158" font-size="12" text-anchor="middle">relay</text>

  <line x1="812" y1="120" x2="862" y2="120" stroke="#8e8e93" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="837" y="108" fill="#8e8e93" font-size="12" text-anchor="middle">Bluetooth</text>

  <text x="520" y="222" fill="#8e8e93" font-size="13" text-anchor="middle">No SIM, no mobile network, no servers: every link is radio between the units, or Bluetooth to a phone.</text>
  <text x="520" y="38" fill="#30d158" font-size="13" font-weight="600" text-anchor="middle" letter-spacing=".5">LoRa 868 / 915 MHz · up to 3 relays · AES-256 team channel</text>
</svg>
