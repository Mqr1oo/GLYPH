name: Something does not work
description: Report a problem with the GLYPH app or device.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App version
      description: Control › App, at the bottom. For example 1.3.0.
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Status › Firmware. For example 04.10.26.
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      description: For example Pixel 8, Android 16.
  - type: textarea
    id: more
    attributes:
      label: Screenshots or anything else
      description: Drag images here. Please leave out your access code and team name.
